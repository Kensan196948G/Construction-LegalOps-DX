# LegalOps dedicated nginx (native systemd, replaces legalops-nginx and construction-legalops-mvp-nginx-1).
# Installed to /etc/nginx/legalops-main.conf; run by legalops-nginx.service. 2026-09-04
# Routes mirror infra/nginx/default.conf (prod) and infra/nginx/mvp.conf (mvp); only the
# listen addresses and upstream targets differ (127.0.0.1 ports, see docs/PORT_ALLOCATION.md).
user www-data;
worker_processes auto;
pid /run/nginx-legalops.pid;
error_log /var/log/nginx/legalops-error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/legalops-access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml text/css text/javascript text/plain text/xml;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=mvp_api_limit:10m rate=120r/m;

    upstream legalops_backend  { server 127.0.0.1:8011 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream legalops_frontend { server 127.0.0.1:3011 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream mvp_legalops_backend  { server 127.0.0.1:8013 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream mvp_legalops_frontend { server 127.0.0.1:3013 max_fails=3 fail_timeout=30s; keepalive 32; }

    # ---------------- prod: legalops.mirai-dx-platform.com -> cloudflared -> 127.0.0.1:8410 ----------------
    server {
        listen 127.0.0.1:8410;
        server_name legalops.mirai-dx-platform.com localhost;

        location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
        location = /csp-report { access_log off; add_header Content-Type text/plain; return 204; }

        include /etc/nginx/legalops-security-headers.conf;
        client_max_body_size 50M;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://legalops_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
        # NextAuth lives on the frontend; must win over /api/.
        location ~* ^/api/auth(/|$) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://legalops_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /_next/static/ {
            proxy_pass http://legalops_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/legalops-security-headers.conf;
        }
        location / {
            proxy_pass http://legalops_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
        }
    }

    # ---------------- mvp: legalops-mvp.mirai-dx-platform.com -> cloudflared -> 127.0.0.1:8412 ----------------
    server {
        listen 127.0.0.1:8412;
        server_name legalops-mvp.mirai-dx-platform.com localhost;

        location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
        location = /readyz {
            access_log off;
            proxy_pass http://mvp_legalops_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /csp-report { access_log off; add_header Content-Type text/plain; return 204; }

        include /etc/nginx/legalops-security-headers.conf;
        client_max_body_size 50M;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        location /api/ {
            limit_req zone=mvp_api_limit burst=60 nodelay;
            proxy_pass http://mvp_legalops_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
        location /_next/static/ {
            proxy_pass http://mvp_legalops_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/legalops-security-headers.conf;
        }
        location / {
            proxy_pass http://mvp_legalops_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
        }
    }
}
