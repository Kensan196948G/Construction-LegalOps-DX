# ============================================================
# Construction-LegalOps-DX nginx リバースプロキシ
# - `/api/*`        → backend:8000 (FastAPI)
# - `/`             → frontend:3000 (Next.js standalone)
# - `/healthz`      → nginx 自身の生存確認
# - 共通: gzip / セキュリティヘッダ / 50MB アップロード対応 (契約書 PDF)
#
# シンタックス確認 (ローカル):
#   docker run --rm -v "$PWD/infra/nginx:/etc/nginx/conf.d:ro" nginx:1.27-alpine nginx -t
# ============================================================

# Upstreams
upstream legalops_backend {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream legalops_frontend {
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# gzip (圧縮対象は静的アセット + JSON)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Rate limit (ログイン総当たり防止)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

# ------------------------------------------------------------
# HTTP (port 80)
# staging: HTTP のみで起動可
# production:
#   - Cloudflare Tunnel 採用時: origin は nginx:80 の HTTP 終端を許容し、
#     Cloudflare edge TLS + Access を外部境界にする。
#   - 直接公開 / origin TLS 採用時: 443 へ恒久リダイレクト
#     (Let's Encrypt /.well-known/acme-challenge は許可)。
# ------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Nginx 自身のヘルスチェック
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 直接公開 / origin TLS 採用時のみ、承認後に下行を有効化する。
    # Cloudflare Tunnel 採用時は cloudflared が nginx:80 へ到達するため有効化しない。
    # return 301 https://$host$request_uri;

    # staging では HTTP でアプリ配信を許容 (self-signed を使わない簡便モード)
    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 50M;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    # --- API ---
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://legalops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- Auth (ログイン系のレート制限を厳しめに) ---
    location ~* ^/api/(auth|login|token) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://legalops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js static assets (long cache) ---
    location /_next/static/ {
        proxy_pass http://legalops_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://legalops_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # WebSocket (Next.js HMR / 将来の通知用)
        proxy_set_header Upgrade $http_upgrade;
    }
}

# ------------------------------------------------------------
# HTTPS (port 443)
# staging: self-signed cert (`/etc/nginx/certs/{fullchain.pem,privkey.pem}`)
# production:
#   - Cloudflare Tunnel 採用時: 443 は origin TLS を要求する場合のみ使用。
#   - 直接公開 / origin TLS 採用時: Let's Encrypt (ACME http-01) を
#     certbot-renew profile または別 host 経由でローテーションする。
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (production の正規証明書時のみ有効)
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/conf.d/security-headers.conf;

    client_max_body_size 50M;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://legalops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~* ^/api/(auth|login|token) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://legalops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://legalops_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location / {
        proxy_pass http://legalops_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
    }
}
