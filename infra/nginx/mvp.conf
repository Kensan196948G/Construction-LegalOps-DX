# ============================================================
# Construction-LegalOps-DX — MVP / Prototype nginx (HTTP only)
# - `/api/*`      → backend:8000 (FastAPI)
# - `/`           → frontend:3000 (Next.js standalone)
# - `/healthz`    → nginx 自身の生存確認
#
# MVP は Cloudflare Tunnel（edge TLS）経由のため origin は HTTP 終端。
# 本番用 default.conf の 443 / cert 依存を含まない独立設定。
# ============================================================

upstream mvp_legalops_backend {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream mvp_legalops_frontend {
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

limit_req_zone $binary_remote_addr zone=mvp_api_limit:10m rate=120r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /csp-report {
        access_log off;
        add_header Content-Type text/plain;
        return 204;
    }

    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 50M;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    location /api/ {
        limit_req zone=mvp_api_limit burst=60 nodelay;
        proxy_pass http://mvp_legalops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /_next/static/ {
        proxy_pass http://mvp_legalops_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location / {
        proxy_pass http://mvp_legalops_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
    }
}
