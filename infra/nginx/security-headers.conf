# ============================================================
# Construction-LegalOps-DX 共通セキュリティヘッダ
#  - default.conf 内で `include /etc/nginx/conf.d/security-headers.conf;`
#  - 法務 DX 用途のため robots は noindex 推奨 (フロント側 metadata で実装)
# ============================================================

# HSTS: 2 年 + サブドメ + preload (本番 HTTPS 配信を前提)
# staging では HTTP のみ配信されることがあるため、HTTPS バーチャルホスト側で include する。
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# MIME sniffing 抑止
add_header X-Content-Type-Options "nosniff" always;

# クリックジャッキング対策 (CSP frame-ancestors と二重防御)
add_header X-Frame-Options "DENY" always;

# Referrer はクロスオリジン時に origin のみ送出
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 不要なブラウザ API を全面ブロック (建設業務上 camera/mic/geo は使用しない)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Cross-Origin policies (法務文書を扱うため厳格化)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# CSP は段階導入: まず Report-Only で監視 → 本番安定後 Content-Security-Policy へ昇格
# script-src 'self' のみ。Next.js は inline script を吐くため nonce ベース化は Loop 5 で検討。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.sharepoint.com https://*.blob.core.windows.net; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://api.anthropic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /csp-report" always;

# サーバ情報秘匿
server_tokens off;
