# ============================================================
# Construction-LegalOps-DX セキュリティヘッダ — CSP ENFORCE 版
#
# 使用方法:
#   CSP Report-Only → Enforce 移行時に以下を実施:
#   1. 7日間以上の CSP Report-Only データを収集し違反がないことを確認
#   2. security-headers.conf の Content-Security-Policy-Report-Only 行を削除
#   3. 本ファイルの内容を security-headers.conf に統合するか
#      nginx.conf で include を差し替える
#
# 移行チェックリスト:
#   [ ] report-uri (/csp-report) の違反ログを 7日間分確認
#   [ ] 'unsafe-inline' を nonce ベースに変更済み (Next.js nonce 対応後)
#   [ ] staging で 100% カナリーテスト通過
#   [ ] 法務担当者・インフラリードの承認
# ============================================================

# HSTS: 2 年 + サブドメ + preload
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# MIME sniffing 抑止
add_header X-Content-Type-Options "nosniff" always;

# クリックジャッキング対策
add_header X-Frame-Options "DENY" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Cross-Origin policies
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# CSP ENFORCE (Report-Only からの昇格)
# 違反はリアルタイムで /csp-report に送信される
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.sharepoint.com https://*.blob.core.windows.net; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://api.anthropic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /csp-report" always;

# サーバ情報秘匿
server_tokens off;
