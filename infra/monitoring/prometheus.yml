# Prometheus scrape configuration for Construction-LegalOps-DX
# Deploy: copy to /etc/prometheus/prometheus.yml or mount via docker compose
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: construction-legalops-dx

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "legalops-backend"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8000
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: "fastapi"
      - target_label: env
        replacement: "compose"

  - job_name: "legalops-nginx"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"
