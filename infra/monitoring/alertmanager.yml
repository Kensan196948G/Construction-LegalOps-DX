# Alertmanager configuration for Construction-LegalOps-DX
# Deploy: mount at /etc/alertmanager/alertmanager.yml

global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST:-localhost:587}"
  smtp_from: "${ALERT_FROM:-legalops-alert@example.com}"
  smtp_auth_username: "${SMTP_USER:-}"
  smtp_auth_password: "${SMTP_PASS:-}"
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      continue: true
    - match:
        severity: warning
      receiver: "warning"

receivers:
  - name: "default"
    webhook_configs:
      - url: "${WEBHOOK_URL:-http://localhost:8080/alerts}"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "${CRITICAL_WEBHOOK_URL:-http://localhost:8080/alerts/critical}"
        send_resolved: true

  - name: "warning"
    webhook_configs:
      - url: "${WARNING_WEBHOOK_URL:-http://localhost:8080/alerts/warning}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]