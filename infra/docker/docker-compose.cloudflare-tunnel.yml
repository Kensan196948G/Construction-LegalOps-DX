# ============================================================
# Construction-LegalOps-DX docker-compose Cloudflare Tunnel overlay
#
# Usage after human approval (#50):
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.prod.yml \
#     -f infra/docker/docker-compose.cloudflare-tunnel.yml \
#     --profile worker \
#     --profile cloudflare-tunnel up -d
#
# Safety:
#   - This file does not create Cloudflare DNS, Access, Tunnel, or Neon resources.
#   - The tunnel is run with a credentials file + local ingress config, NOT
#     --token. A token-run tunnel with no dashboard public-hostname returns 503
#     for every HTTP request; the local config.yml defines the ingress instead.
#   - CLOUDFLARE_TUNNEL_CREDENTIALS_FILE points at the tunnel credentials JSON
#     (a secret, bind-mounted read-only from the host — never committed).
#   - nginx host ports are closed; cloudflared reaches nginx:80 on legalops-net.
# ============================================================
name: construction-legalops-dx

services:
  nginx:
    ports: !reset []
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: legalops-cloudflared
    restart: unless-stopped
    # Run as the host user that owns the mounted credentials file (mode 0400),
    # otherwise the default nonroot image user cannot read /etc/cloudflared/creds.json.
    user: "${CLOUDFLARE_TUNNEL_UID:-1000}:${CLOUDFLARE_TUNNEL_GID:-1000}"
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--config"
      - "/etc/cloudflared/config.yml"
      - "run"
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARE_TUNNEL_CREDENTIALS_FILE:?required — path to the tunnel credentials JSON}:/etc/cloudflared/creds.json:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - legalops-net
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
          cpus: "0.05"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    profiles: ["cloudflare-tunnel"]
