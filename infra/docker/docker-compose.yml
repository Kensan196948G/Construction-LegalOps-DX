# ============================================================
# Construction-LegalOps-DX docker-compose
# Loop 1: サービス枠の定義のみ。各 Dockerfile / 実装は Loop 2 以降。
# ============================================================
name: construction-legalops-dx

services:
  postgres:
    image: postgres:16-alpine
    container_name: legalops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalops_dev}
      POSTGRES_DB: ${POSTGRES_DB:-legalops}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalops} -d ${POSTGRES_DB:-legalops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legalops-net

  backend:
    # Loop 2 以降で backend/Dockerfile を追加
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: construction-legalops-dx/backend:dev
    container_name: legalops-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_URL: ${DB_URL:-postgresql+asyncpg://legalops:legalops_dev@postgres:5432/legalops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legalops-net

  frontend:
    # Loop 2 以降で frontend/Dockerfile を追加
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: construction-legalops-dx/frontend:dev
    container_name: legalops-frontend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - legalops-net

  nginx:
    image: nginx:1.27-alpine
    container_name: legalops-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../nginx:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - legalops-net

volumes:
  pgdata:
    name: legalops-pgdata

networks:
  legalops-net:
    name: legalops-net
    driver: bridge
