# ============================================================
# Construction-LegalOps-DX docker-compose (base)
# Loop 4: Redis / Celery 追加・全 healthcheck・non-root・profile 分割
#
# Profiles:
#   - default (none specified): postgres / redis / backend / frontend / nginx
#   - worker : celery-worker / celery-beat (`--profile worker`)
#   - tools  : 補助 (init-db 等)        (`--profile tools`)
#   - monitoring : Prometheus / Alertmanager / Grafana
#   - logging : Loki / Promtail
#   - tls-renewal : certbot renewal helper
#
# 本番設定は `docker-compose.prod.yml` をオーバーレイで適用すること。
#   例: docker compose -f infra/docker/docker-compose.yml \
#                      -f infra/docker/docker-compose.prod.yml up -d
# ============================================================
name: construction-legalops-dx

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: ${TZ:-Asia/Tokyo}

x-restart: &restart
  restart: unless-stopped

services:
  # ----------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: legalops-postgres
    <<: *restart
    # 公式 postgres image は USER=postgres (uid 70) で動作。non-root を確保。
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalops_dev}
      POSTGRES_DB: ${POSTGRES_DB:-legalops}
      TZ: ${TZ:-Asia/Tokyo}
      PGTZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-legalops} -d ${POSTGRES_DB:-legalops}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------
  # Redis 7 (cache + Celery broker/result backend)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: legalops-redis
    <<: *restart
    user: "999:1000" # redis (uid 999, gid 1000) — 公式イメージ既定
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${REDIS_PORT:-6392}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------
  # Backend (FastAPI)
  # ----------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: construction-legalops-dx/backend:dev
    container_name: legalops-backend
    <<: *restart
    # backend/Dockerfile 側で USER appuser (uid 10001) を想定
    user: "10001:10001"
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      DB_URL: ${DB_URL:-postgresql+asyncpg://legalops:legalops_dev@postgres:5432/legalops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      BACKEND_PORT: ${BACKEND_PORT:-8010}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # FastAPI 側の /healthz エンドポイントを叩く (Loop 2 backend 実装と整合)
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/healthz'',timeout=3).status==200 else 1)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------
  # Celery worker (非同期ジョブ: 契約書解析 / SharePoint sync 等)
  # `--profile worker` で起動
  # ----------------------------------------------------------
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: construction-legalops-dx/backend:dev
    container_name: legalops-celery-worker
    <<: *restart
    user: "10001:10001"
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
      ]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      DB_URL: ${DB_URL:-postgresql+asyncpg://legalops:legalops_dev@postgres:5432/legalops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true
    profiles: ["worker"]

  # ----------------------------------------------------------
  # Celery beat (定時バッチ: 監査ログローテーション等)
  # ----------------------------------------------------------
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: construction-legalops-dx/backend:dev
    container_name: legalops-celery-beat
    <<: *restart
    user: "10001:10001"
    # Write the schedule DB and pidfile to the writable tmpfs, not the CWD:
    # the prod overlay mounts the root filesystem read-only, so the default
    # ./celerybeat-schedule path fails with [Errno 13] Permission denied.
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
        "--pidfile=/tmp/celerybeat.pid",
      ]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # beat はプロセス存在確認のみ
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true
    profiles: ["worker"]

  # ----------------------------------------------------------
  # Frontend (Next.js 15 / standalone)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: construction-legalops-dx/frontend:dev
    container_name: legalops-frontend
    <<: *restart
    # frontend/Dockerfile 側で USER nextjs (uid 1001) を想定
    user: "1001:1001"
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8010}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010/api/v1}
      FRONTEND_PORT: ${FRONTEND_PORT:-3010}
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Next.js standalone は /api/health 等を持たないため、TCP/HTTP 200 確認
      test: [
          "CMD-SHELL",
          # localhost はコンテナ内で ::1 (IPv6) に解決されるが Next.js は IPv4 のみ
          # listen するため、busybox wget では常に失敗する。127.0.0.1 に固定する。
          "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------
  # Nginx (リバースプロキシ / TLS termination)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: legalops-nginx
    <<: *restart
    # 公式 nginx image は master を root で起動するが worker は nginx user (uid 101)
    # non-root 化は本番 overlay 側で user 指定 + ポート 8080/8443 化を検討。
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${NGINX_PORT:-8410}:80"
      - "${NGINX_TLS_PORT:-8453}:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      # TLS 証明書 (staging: self-signed / production: Let's Encrypt をマウント)
      - nginx-certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------
  # Prometheus (metrics collection)
  # `--profile monitoring` で起動
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: legalops-prometheus
    <<: *restart
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true
    profiles: ["monitoring"]

  # ----------------------------------------------------------
  # Alertmanager (alert routing)
  # `--profile monitoring` で起動
  # ----------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: legalops-alertmanager
    <<: *restart
    user: "65534:65534"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true
    profiles: ["monitoring"]

  # ----------------------------------------------------------
  # Grafana (dashboards)
  # `--profile monitoring` で起動
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: legalops-grafana
    <<: *restart
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/legalops-backend.json:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true
    profiles: ["monitoring"]

  # ----------------------------------------------------------
  # Loki (log aggregation)
  # `--profile logging` で起動
  # ----------------------------------------------------------
  loki:
    image: grafana/loki:3.2.1
    container_name: legalops-loki
    <<: *restart
    user: "10001:10001"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true
    profiles: ["logging"]

  # ----------------------------------------------------------
  # Promtail (Docker container log shipper)
  # `--profile logging` で起動
  # ----------------------------------------------------------
  promtail:
    image: grafana/promtail:3.2.1
    container_name: legalops-promtail
    <<: *restart
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ../monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - legalops-net
    security_opt:
      - no-new-privileges:true
    profiles: ["logging"]

  # ----------------------------------------------------------
  # Certbot renewal helper
  # `--profile tls-renewal` で起動
  # ----------------------------------------------------------
  certbot-renew:
    image: certbot/certbot:v2.11.0
    container_name: legalops-certbot-renew
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${CERTBOT_DOMAINS:-}" ] || [ -z "$${CERTBOT_EMAIL:-}" ]; then
          echo "CERTBOT_DOMAINS and CERTBOT_EMAIL are required for certificate issuance/renewal." >&2
          exit 64
        fi
        domain_args=""
        for domain in $${CERTBOT_DOMAINS}; do
          domain_args="$${domain_args} -d $${domain}"
        done
        primary_domain="$${CERTBOT_PRIMARY_DOMAIN:-}"
        if [ -z "$${primary_domain}" ]; then
          set -- $${CERTBOT_DOMAINS}
          primary_domain="$$1"
        fi
        if [ ! -f /etc/letsencrypt/live/$${primary_domain}/fullchain.pem ]; then
          certbot certonly --webroot --webroot-path /var/www/certbot \
            --email "$${CERTBOT_EMAIL}" --agree-tos --no-eff-email \
            $${domain_args}
        fi
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep "$${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}"
        done
    volumes:
      - nginx-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - legalops-net
    profiles: ["tls-renewal"]

volumes:
  pgdata:
    name: legalops-pgdata
  redisdata:
    name: legalops-redisdata
  nginx-certs:
    name: legalops-nginx-certs
  prometheus-data:
    name: legalops-prometheus-data
  grafana-data:
    name: legalops-grafana-data
  loki-data:
    name: legalops-loki-data
  certbot-www:
    name: legalops-certbot-www

networks:
  legalops-net:
    name: legalops-net
    driver: bridge
