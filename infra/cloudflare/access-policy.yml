# Cloudflare Access ポリシー定義 — Construction-LegalOps-DX
# 適用: Cloudflare Zero Trust → Access → Applications
# Status: IaC 雛形（本番適用は人間による Access アプリ作成後）
#
# 2026-07-20 ユーザー決定: 本デプロイは Entra ID / M365 を使用せず、
# Cloudflare Access を唯一の認証境界とする（アプリ側は EDGE_AUTH_BOUNDARY
# opt-in の Access 前提モード）。IdP はメール One-time PIN を使用し、
# 許可メールアドレスは Access のルールグループで管理する。

applications:
  - name: "LegalOps-DX"
    domain: "legalops.mirai-dx-platform.com"
    type: self_hosted
    session_duration: "24h"
    identity_providers:
      - type: one_time_pin
        # メール OTP。将来 IdP (Entra ID 等) を導入する場合はここへ追加し、
        # 下記のコメントアウトされた MFA 要求を有効化する。
    policies:
      - name: "Allow LegalOps Users"
        decision: allow
        include:
          # Cloudflare Access のルールグループ (Zero Trust → Access → Groups)。
          # 許可する社員メールアドレスを LegalOps-Users グループへ登録する。
          - group:
              name: "LegalOps-Users"
        # 将来 IdP 導入時に有効化 (OTP 単独では authentication_method 要求不可):
        # require:
        #   - authentication_method:
        #       value: "mfa"
        exclude: []
      - name: "Admin Panel — Legal Lead+ Only"
        decision: allow
        include:
          - group:
              name: "LegalOps-Admins"
        # require:
        #   - authentication_method:
        #       value: "mfa"
        exclude: []
        # /settings /admin パスのみに適用（Access の path-based routing で制御）
        path: "/settings*"
      - name: "Admin API — Legal Lead+ Only"
        decision: allow
        include:
          - group:
              name: "LegalOps-Admins"
        # require:
        #   - authentication_method:
        #       value: "mfa"
        exclude: []
        path: "/api/v1/admin*"

# ============================================================
# 適用手順:
# 1. 人間: Zero Trust → Access → Groups で LegalOps-Users / LegalOps-Admins を
#    作成し、許可メールアドレスを登録（IdP 追加は不要 — メール OTP を使用）
# 2. 人間: Access → Applications で legalops.mirai-dx-platform.com を登録
# 3. 人間: 上記ポリシーを GUI または Terraform/API で適用
# 4. CTO: 動作確認（OTP 認証フロー・Access 境界・アプリ RBAC）
# ============================================================
