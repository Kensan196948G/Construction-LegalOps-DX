# Alembic configuration for Construction-LegalOps-DX.
#
# The actual database URL is supplied at runtime from the DB_URL environment
# variable inside alembic/env.py (owned by the migrations team) - this file
# only configures script discovery and formatting.
# NOTE: keep this file pure ASCII. Alembic reads it with encoding="locale",
# so any non-ASCII byte breaks `alembic` on Windows (cp932) entirely.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used for generating migration files (timestamp + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use OS-local timestamps for filenames.
timezone = UTC

# Truncate slug length for filenames.
truncate_slug_length = 40

# Run migrations as transactional per migration (set False to use a single tx).
transaction_per_migration = true

# Path separator for version_locations.
version_path_separator = os

# The sqlalchemy.url is intentionally a placeholder; env.py reads the real
# value from app.core.config.settings.db_url.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Output encoding for generated migration files.
output_encoding = utf-8


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# ---------------------------------------------------------------------------
# Post-write hooks (ruff format on generated migration files)
# ---------------------------------------------------------------------------

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
