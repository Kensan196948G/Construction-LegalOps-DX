[project]
name = "construction-legalops-dx-backend"
version = "0.1.12"
description = "Construction-LegalOps-DX backend — Japanese construction industry legal operations support platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Construction-LegalOps-DX Contributors" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "PyJWT[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "anthropic>=0.39.0",
    "msal>=1.31.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "tenacity>=9.0.0",
    "cryptography>=43.0.3",
    "msgpack>=1.2.1",     # GHSA-6v7p-g79w-8964 fix (transitive via CacheControl/locust)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "bandit[toml]>=1.7.10",
    "types-passlib>=1.7.7",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    "S101",   # assert usage in tests
    "B008",   # function calls in argument defaults (FastAPI Depends)
    "B904",   # raise-without-from-inside-except — intentional in HTTPException patterns
    "B905",   # zip-without-explicit-strict — acceptable for known-length iterables
    "S105",   # hardcoded-password-string — false positive for token_type field names
    "S106",   # hardcoded-password-func-arg — false positive for token_type="Bearer"
    "S108",   # probable-insecure-usage-of-temp-file — stub code only
    "S110",   # try-except-pass — intentional fallback pattern in alembic env
    "N806",   # variable-in-function-should-be-lowercase — SQLAlchemy Session type variable
    "RUF001", # ambiguous-unicode-character-string — intentional Japanese full-width chars
    "RUF002", # ambiguous-unicode-character-docstring — intentional Japanese full-width chars
    "RUF003", # ambiguous-unicode-character-comment — intentional Japanese full-width chars
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLR2004"]
"alembic/**" = ["E501", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
enable_incomplete_feature = ["NewGenericSyntax"]

[[tool.mypy.overrides]]
module = [
    "jwt.*",
    "passlib.*",
    "celery.*",
    "pypdf.*",
    "docx.*",
    "openpyxl.*",
    "aiosqlite.*",
    "msal.*",
    "anthropic.*",
    "redis.*",
    "structlog.*",
    "prometheus_client.*",
    "tenacity.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/__init__.py"]
