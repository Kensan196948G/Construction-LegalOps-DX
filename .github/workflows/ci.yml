name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで連続 push された際は古い実行をキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ============================================================
  # Backend: Python / FastAPI
  # ============================================================
  backend:
    name: Backend (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff mypy pytest pytest-asyncio

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy app || true  # Loop 1 ではアプリ実装が未着手のためソフトフェイル

      - name: Pytest
        run: pytest -q || true  # Loop 1 ではテスト未整備のためソフトフェイル

  # ============================================================
  # Frontend: Next.js / TypeScript
  # ============================================================
  frontend:
    name: Frontend (eslint / tsc / jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint --if-present

      - name: TypeScript check
        run: npm run typecheck --if-present

      - name: Jest
        run: npm test --if-present -- --ci --passWithNoTests

  # ============================================================
  # Security: Trivy (filesystem) + Bandit (Python)
  # ============================================================
  security:
    name: Security (trivy / bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit (Python static analysis)
        run: bandit -r backend/app -ll || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # ============================================================
  # Docker build
  # ============================================================
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: docker compose -f infra/docker/docker-compose.yml config

      - name: Build (skip if Dockerfiles not present yet)
        run: |
          if [ -f backend/Dockerfile ] && [ -f frontend/Dockerfile ]; then
            docker compose -f infra/docker/docker-compose.yml build
          else
            echo "Dockerfiles not present yet (Loop 1). Skipping build."
          fi
