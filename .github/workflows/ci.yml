name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで連続 push された際は古い実行をキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  TZ: Asia/Tokyo

jobs:
  # ============================================================
  # Backend: Python / FastAPI
  #  - Loop 4 以降: ruff / mypy / pytest をハードフェイル化
  #  - pytest は 48 unit テストを全 PASS させること
  # ============================================================
  backend:
    name: Backend (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Ruff (lint) — HARD
        run: ruff check .

      - name: Mypy (type check) — HARD
        run: mypy app

      - name: Pytest — HARD (48 unit tests must pass)
        env:
          APP_ENV: test
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q --maxfail=1 --disable-warnings

  # ============================================================
  # Frontend: Next.js / TypeScript
  #  - eslint / tsc はハードフェイル
  #  - jest は MSW セットアップ完了までソフトフェイル (Loop 5 で硬化)
  # ============================================================
  frontend:
    name: Frontend (eslint / tsc / jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint — HARD
        run: npm run lint

      - name: TypeScript check — HARD
        run: npm run typecheck

      - name: Jest — SOFT (MSW セットアップ完了で硬化予定)
        run: npm test --if-present -- --ci --passWithNoTests || true

  # ============================================================
  # Security: Bandit + Trivy (PR / push 時の軽量チェック)
  # 深いスキャンは security.yml の weekly schedule 側で実施。
  # ============================================================
  security:
    name: Security (bandit / trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit[toml]"

      - name: Bandit (Python static analysis) — HARD on high severity
        run: bandit -r backend/app -ll -ii

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.60.0

      - name: Trivy filesystem scan
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table

  # ============================================================
  # Docker build (compose validation + 実 build)
  # ============================================================
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose (base)
        run: docker compose -f infra/docker/docker-compose.yml config >/dev/null

      - name: Validate docker-compose (prod overlay)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          DB_URL: postgresql+asyncpg://ci:ci@postgres:5432/ci
          REDIS_URL: redis://redis:6379/0
          REDIS_PASSWORD: ci
          CELERY_BROKER_URL: redis://:ci@redis:6379/1
          CELERY_RESULT_BACKEND: redis://:ci@redis:6379/2
          JWT_SECRET: ci-secret
          ENTRA_TENANT_ID: ci
          ENTRA_CLIENT_ID: ci
          ENTRA_CLIENT_SECRET: ci
          CLAUDE_API_KEY: ci
          HENNGE_TENANT_ID: ci
          HENNGE_API_KEY: ci
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid
        run: |
          docker compose \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.prod.yml \
            config >/dev/null

      - name: Build images
        run: |
          if [ -f backend/Dockerfile ] && [ -f frontend/Dockerfile ]; then
            docker compose -f infra/docker/docker-compose.yml build
          else
            echo "Dockerfiles missing — failing fast."
            exit 1
          fi
