name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで連続 push された際は古い実行をキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  TZ: Asia/Tokyo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================
  # Backend: Python / FastAPI
  #  - Loop 4 以降: ruff / mypy / pytest をハードフェイル化
  #  - pytest は 48 unit テストを全 PASS させること
  # ============================================================
  backend:
    name: Backend (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e ".[dev]"

      - name: Ruff (lint) — HARD
        run: ruff check .

      - name: Mypy (type check) — HARD
        run: mypy app

      - name: Pytest — HARD (48 unit tests must pass)
        env:
          APP_ENV: test
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q --disable-warnings

  # ============================================================
  # Backend: Integration tests against real PostgreSQL 16
  # (P1 HANDOVER.md item — ensures ARRAY/JSONB/pgvector compatibility)
  # ============================================================
  backend-pg:
    name: Backend (pytest / PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legalops
          POSTGRES_PASSWORD: legalops_dev
          POSTGRES_DB: legalops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest against PostgreSQL (integration tests)
        env:
          APP_ENV: test
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_USE_POSTGRES: "1"
          PYTEST_DATABASE_URL: postgresql+asyncpg://legalops:legalops_dev@localhost:5432/legalops_test
          JWT_SECRET: ci-test-secret-key-not-for-production
        run: |
          pytest tests/integration/ -q --disable-warnings --tb=short

  # ============================================================
  # Backend: Alembic migration chain against real PostgreSQL 16
  #  - integration tests は create_all 経由のため、本番デプロイが踏む
  #    「マイグレーション連鎖の実行可能性」と rollback contract はこのジョブで検証する
  #    (env.py の URL 解決欠陥が本番初回 upgrade を壊していた再発防止)
  # ============================================================
  migrations:
    name: Backend (alembic roundtrip / PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legalops
          POSTGRES_PASSWORD: legalops_dev
          POSTGRES_DB: legalops_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Alembic roundtrip (upgrade / downgrade / idempotency)
        env:
          DB_URL: postgresql+asyncpg://legalops:legalops_dev@localhost:5432/legalops_migrations
          APP_ENV: test
          JWT_SECRET: ci-test-secret-key-not-for-production
        run: |
          ../scripts/verify_migrations_roundtrip.sh --use-existing-db

  # ============================================================
  # Frontend: Next.js / TypeScript
  #  - eslint / tsc はハードフェイル
  #  - jest は MSW セットアップ完了までソフトフェイル (Loop 5 で硬化)
  # ============================================================
  frontend:
    name: Frontend (eslint / tsc / jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint — HARD
        run: npm run lint

      - name: TypeScript check — HARD
        run: npm run typecheck

      - name: Jest — HARD
        run: npm test --if-present -- --ci --forceExit

  # ============================================================
  # Security: Bandit + Trivy (PR / push 時の軽量チェック)
  # 深いスキャンは security.yml の weekly schedule 側で実施。
  # ============================================================
  security:
    name: Security (bandit / trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit[toml]"

      - name: Bandit (Python static analysis) — HARD on high severity
        run: bandit -r backend/app -ll -ii

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Trivy filesystem scan
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table

  # ============================================================
  # Docker build (compose validation + 実 build)
  # ============================================================
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create stub .env for compose validation
        run: touch .env

      - name: Validate docker-compose (base)
        run: docker compose -f infra/docker/docker-compose.yml config >/dev/null

      - name: Validate docker-compose (prod overlay)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          DB_URL: postgresql+asyncpg://ci:ci@postgres:5432/ci
          REDIS_URL: redis://redis:6379/0
          REDIS_PASSWORD: ci
          CELERY_BROKER_URL: redis://:ci@redis:6379/1
          CELERY_RESULT_BACKEND: redis://:ci@redis:6379/2
          JWT_SECRET: ci-secret
          ENTRA_TENANT_ID: ci
          ENTRA_CLIENT_ID: ci
          ENTRA_CLIENT_SECRET: ci
          CLAUDE_API_KEY: ci
          HENNGE_TENANT_ID: ci
          HENNGE_API_KEY: ci
          SSO_MODE: real
          AI_REVIEW_MODE: real
          SHAREPOINT_MODE: real
          NOTIFY_MODE: real
          CLOUDFLARE_ACCESS_ISSUER: https://ci.cloudflareaccess.com
          CLOUDFLARE_ACCESS_AUD: ci
          AUTH_URL: https://ci.invalid
          AUTH_SECRET: ci
          NEXT_PUBLIC_API_BASE_URL: https://ci.invalid
        run: |
          docker compose \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.prod.yml \
            config >/dev/null

      - name: Build images
        run: |
          if [ -f backend/Dockerfile ] && [ -f frontend/Dockerfile ]; then
            docker compose -f infra/docker/docker-compose.yml build
          else
            echo "Dockerfiles missing — failing fast."
            exit 1
          fi

  # ============================================================
  # E2E: Playwright smoke tests (Next.js + AUTH_DEV_BYPASS)
  # Requires: Next.js build → start → playwright test
  # ============================================================
  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js (AUTH_DEV_BYPASS=true)
        env:
          AUTH_DEV_BYPASS: "true"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
        run: npm run build

      - name: Run Playwright smoke tests
        env:
          AUTH_DEV_BYPASS: "true"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
          CI: "true"
        run: npx playwright test --reporter=github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
