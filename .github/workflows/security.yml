name: Security (weekly deep scan)

# 毎週月曜 03:00 JST (= UTC 18:00 日曜) に実行 + 手動実行
on:
  schedule:
    - cron: "0 18 * * 1" # 月曜 03:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security.yml"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TZ: Asia/Tokyo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ----------------------------------------------------------
  # Bandit (Python)
  # ----------------------------------------------------------
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit[toml,sarif]"

      - name: Bandit scan (SARIF + table)
        run: |
          # SARIF 出力（code scanning 連携用）と人間可読 table を両方生成。
          bandit -r backend/app -ll -ii -f sarif -o bandit.sarif || true
          bandit -r backend/app -ll -ii -f txt -o bandit.txt || true

      - name: Upload Bandit SARIF (code scanning)
        # private リポジトリで GitHub Advanced Security 未有効の場合、SARIF upload は 403 を返す。
        # その場合でもジョブを失敗させず、下の artifact fallback で結果を保全する。
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit report (artifact fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit.sarif
            bandit.txt
          if-no-files-found: ignore

  # ----------------------------------------------------------
  # Trivy (filesystem + config + secrets)
  # ----------------------------------------------------------
  trivy:
    name: Trivy (fs / config / secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy CLI
        # install.sh を main から取得しバージョン引数を省略 → スクリプトが最新安定版を自動解決。
        # ピン留め版 (v0.57.0/contrib/install.sh) は古いタグの release tarball 整理で 404 になり壊れるため不採用。
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Trivy filesystem scan (JSON report)
        run: |
          # Always produce JSON artifact even if exit-code 1; captured on next step.
          trivy fs . \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --scanners vuln,secret,misconfig \
            --format json \
            --output trivy-fs.json || true

      - name: Trivy filesystem scan (fail on CRITICAL/HIGH)
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln,secret,misconfig \
            --format table \
            --exit-code 1

      - name: Upload Trivy fs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          if-no-files-found: ignore

  # ----------------------------------------------------------
  # pip-audit (Python dependencies)
  # ----------------------------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Resolve project dependencies (lockfile)
        working-directory: backend
        # プロジェクトの実依存だけを隔離 venv に解決し、ロックファイル化する。
        # 裸の `pip-audit` はランナーの ambient pip (例: pip 24.0 の CVE) を誤検知するため使わない。
        run: |
          set -e
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --upgrade pip
          if [ -f requirements.txt ]; then
            /tmp/audit-venv/bin/pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            # editable install にすることで自プロジェクトを freeze --exclude-editable で除外し、
            # pip-audit が PyPI 未公開の自パッケージを探して --strict で失敗するのを防ぐ。
            /tmp/audit-venv/bin/pip install -e .
          else
            echo "No Python dependency file found." >&2
            exit 1
          fi
          /tmp/audit-venv/bin/pip freeze --exclude-editable > ../resolved-requirements.txt

      - name: pip-audit (resolved project deps)
        # --ignore-vuln の根拠 (Issue #40):
        #   PYSEC-2026-1325 / CVE-2024-23342 / GHSA-wj6h-64fc-37mp (ecdsa: Minerva timing attack)
        #   - upstream (python-ecdsa) はサイドチャネル攻撃をスコープ外とし fix_versions なし (won't-fix)
        #   - ecdsa は python-jose[cryptography] の推移的依存。本プロジェクトは RS256/RSA のみ使用し
        #     ES*/ECDSA アルゴリズムの使用は 0 件 (脆弱 API ecdsa.SigningKey.sign_digest() へ到達不能)
        #   - cryptography backend 指定のため EC 演算は pyca/cryptography が担い ecdsa は実行経路に乗らない
        #   - 恒久対応 (python-jose → PyJWT 移行で ecdsa 依存自体を除去) は追跡 Issue #41 参照
        run: |
          set -e
          pip-audit -r resolved-requirements.txt --strict --format json --output pip-audit.json \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln GHSA-wj6h-64fc-37mp

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore

  # ----------------------------------------------------------
  # npm audit (Node dependencies)
  # ----------------------------------------------------------
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (production+dev)
        run: npm ci || npm install

      - name: npm audit (high+)
        run: |
          set +e
          npm audit --audit-level=high --json > ../npm-audit.json
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::npm audit found high/critical vulnerabilities"
          fi
          exit $status

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore

  # ----------------------------------------------------------
  # Docker image scan (Trivy image)
  # ----------------------------------------------------------
  trivy-image:
    name: Trivy (container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (for scan)
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t legalops/backend:scan backend

      - name: Build frontend image (for scan)
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker build -t legalops/frontend:scan frontend

      - name: Install Trivy CLI
        # install.sh を main から取得しバージョン引数を省略 → スクリプトが最新安定版を自動解決。
        # ピン留め版 (v0.57.0/contrib/install.sh) は古いタグの release tarball 整理で 404 になり壊れるため不採用。
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Trivy scan backend image (JSON)
        if: hashFiles('backend/Dockerfile') != ''
        run: |
          trivy image legalops/backend:scan \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format json \
            --output trivy-backend.json || true

      - name: Trivy scan backend image (fail on CRITICAL/HIGH)
        if: hashFiles('backend/Dockerfile') != ''
        run: |
          trivy image legalops/backend:scan \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 1

      - name: Trivy scan frontend image (JSON)
        if: hashFiles('frontend/Dockerfile') != ''
        run: |
          trivy image legalops/frontend:scan \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format json \
            --output trivy-frontend.json || true

      - name: Trivy scan frontend image (fail on CRITICAL/HIGH)
        if: hashFiles('frontend/Dockerfile') != ''
        run: |
          trivy image legalops/frontend:scan \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 1

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-backend.json
            trivy-frontend.json
          if-no-files-found: ignore
