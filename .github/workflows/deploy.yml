name: CD (image publish + CF/Neon deploy)

# ============================================================
# 承認済み CI/CD 経路 (Issue #50 / Loop 29 / Phase 1 最終整備)
#
# - 手動トリガー (workflow_dispatch) のみ。push では一切起動しない。
# - GITHUB_TOKEN (packages:write) だけで動く範囲 = GHCR への
#   コンテナイメージ発行に限定。
# - Cloudflare Pages / Tunnel / Neon の後続ステップは、人間が
#   GitHub Secrets を登録した後に有効化される（未設定時は skip）。
# - 全 CF/Neon ステップは fail-safe: secrets 未設定時はスキップ。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "発行するイメージタグ (例: v0.1.12 / staging)"
        required: true
        default: staging
      push_latest:
        description: "latest タグも併せて更新するか"
        type: boolean
        default: false
      deploy_cf_tunnel:
        description: "Cloudflare Tunnel 設定を更新するか"
        type: boolean
        default: false
      deploy_neon_migration:
        description: "Neon DB マイグレーションを実行するか"
        type: boolean
        default: false
      deploy_cf_pages:
        description: "Cloudflare Pages にデプロイするか (Phase 3)"
        type: boolean
        default: false

concurrency:
  group: cd-image-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  TZ: Asia/Tokyo

jobs:
  # ----------------------------------------------------------
  # 前提確認: 対象 ref の CI が green であることを人間が確認済みの
  # 前提だが、fail-closed のため最低限のビルド検証をここでも行う
  # ----------------------------------------------------------
  publish:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name (lowercase)
        id: img
        env:
          REPO: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "name=${REGISTRY}/${REPO,,}/${COMPONENT}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Construction-LegalOps-DX ${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cd-${{ matrix.component }}
          cache-to: type=gha,scope=cd-${{ matrix.component }},mode=max

  # ----------------------------------------------------------
  # 発行結果サマリ (デプロイ先ホスト向けの pull 手順を明示)
  # ----------------------------------------------------------
  summary:
    name: Publish summary
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Write summary
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.image_tag }}
        run: |
          {
            echo "## 📦 CD (image publish) 完了"
            echo ""
            echo "| コンポーネント | イメージ |"
            echo "|---|---|"
            echo "| backend | \`${REGISTRY}/${REPO,,}/backend:${TAG}\` |"
            echo "| frontend | \`${REGISTRY}/${REPO,,}/frontend:${TAG}\` |"
            echo ""
            echo "デプロイ先ホストでの適用 (docs/OPERATIONS.md 参照):"
            echo '```bash'
            echo "docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml pull"
            echo "docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------
  # Cloudflare Tunnel 設定更新 (Phase 1: 既存 nginx への ingress)
  # CLOUDFLARE_API_TOKEN 未設定時は skip
  # ----------------------------------------------------------
  deploy-cf-tunnel:
    name: Deploy Cloudflare Tunnel config
    runs-on: ubuntu-latest
    needs: publish
    if: inputs.deploy_cf_tunnel && vars.CLOUDFLARE_API_TOKEN != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tunnel config
        run: |
          echo "Validating infra/cloudflare/tunnel-config.example.yml..."
          python3 -c "import yaml; yaml.safe_load(open('infra/cloudflare/tunnel-config.example.yml'))"
          echo "Tunnel config is valid YAML."

      - name: Deploy tunnel config (dry-run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Tunnel config validated. Apply manually:"
          echo "  cloudflared tunnel route dns <TUNNEL_ID> legalops.mirai-dx-platform.com"

  # ----------------------------------------------------------
  # Neon DB マイグレーション (Phase 2: DB 移行時)
  # NEON_DATABASE_URL 未設定時は skip
  # ----------------------------------------------------------
  deploy-neon-migration:
    name: Run Neon DB migration
    runs-on: ubuntu-latest
    needs: publish
    if: inputs.deploy_neon_migration && vars.NEON_DATABASE_URL != ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Alembic migration (Neon)
        env:
          DB_URL: ${{ secrets.NEON_DATABASE_URL }}
          APP_ENV: production
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-placeholder' }}
        run: |
          alembic upgrade head
          alembic current | grep "(head)"

  # ----------------------------------------------------------
  # Cloudflare Pages デプロイ (Phase 3: フロントエンド移行時)
  # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID 未設定時は skip
  # ----------------------------------------------------------
  deploy-cf-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: publish
    if: inputs.deploy_cf_pages && vars.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        env:
          AUTH_DEV_BYPASS: "false"
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://legalops.mirai-dx-platform.com' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy .next --project-name=legalops-dx --branch=main
